name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Deploy repos (which set TAPSEAL_UPSTREAM) carry no tests of their own; upstream runs them.
    if: vars.TAPSEAL_UPSTREAM == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }
      - run: pip install cryptography playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest tests/test_interop.py
      - run: python tests/browser_e2e.py
