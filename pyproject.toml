[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tapseal"
version = "0.3.1"
description = "Hardware-key-gated secrets for AI agents running on hosts you don't control"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.scripts]
tapseal = "tapseal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tapseal"]
